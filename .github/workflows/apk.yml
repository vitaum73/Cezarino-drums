name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - capacitor.config.json
      - .github/workflows/apk.yml

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar os arquivos do app
        run: |
          mkdir www
          cp index.html www/index.html
          cp icon-192.png icon-512.png www/
          # no APK os arquivos já vão dentro do app: sem service worker
          sed -i "s#navigator.serviceWorker.register#(()=>Promise.resolve())#" www/index.html || true

      - name: Criar o projeto Android
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Permissões, nome, versão e ícone
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' $M
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#0E1224</color></resources>' > android/app/src/main/res/values/ic_launcher_background.xml
          R=android/app/src/main/res
          for spec in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read d s f <<< "$spec"
            convert icon-512.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher.png
            convert icon-512.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher_round.png
            convert icon-maskable-512.png -resize ${f}x${f} $R/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Assinar sempre com a mesma chave (para atualizar sem perder os dados)
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Compilar
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DrumCoach.apk
          gh release create "apk-${{ github.run_number }}" DrumCoach.apk --title "DrumCoach APK ${{ github.run_number }}" --notes "APK para instalar no Android. Baixe o arquivo DrumCoach.apk abaixo." --latest
